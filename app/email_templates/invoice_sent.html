<div style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:16px;line-height:22px;font-weight:600;color:#16212E;padding-bottom:16px;">{heading}</div>

<p style="margin:0 0 12px 0;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:14px;line-height:21px;color:#16212E;">Hello {recipient_name},</p>

<p style="margin:0 0 20px 0;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:14px;line-height:21px;color:#16212E;">{intro}</p>

<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="margin:0 0 20px 0;border-collapse:collapse;">
<tr>
    <td style="padding:8px 0;border-bottom:1px solid #D6DCE3;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12px;line-height:18px;letter-spacing:0.07em;text-transform:uppercase;color:#7A8794;">Invoice</td>
    <td align="right" style="padding:8px 0;border-bottom:1px solid #D6DCE3;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:14px;line-height:18px;font-weight:600;color:#16212E;">{invoice_number}</td>
</tr>
<tr>
    <td style="padding:8px 0;border-bottom:1px solid #D6DCE3;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12px;line-height:18px;letter-spacing:0.07em;text-transform:uppercase;color:#7A8794;">Amount due</td>
    <td align="right" style="padding:8px 0;border-bottom:1px solid #D6DCE3;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:14px;line-height:18px;font-weight:600;color:#16212E;">{amount_due}</td>
</tr>
<tr>
    <td style="padding:8px 0;border-bottom:1px solid #D6DCE3;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12px;line-height:18px;letter-spacing:0.07em;text-transform:uppercase;color:#7A8794;">Due</td>
    <td align="right" style="padding:8px 0;border-bottom:1px solid #D6DCE3;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:14px;line-height:18px;color:#16212E;">{due_date}</td>
</tr>
</table>

<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:0 0 20px 0;">
<tr>
    <td style="background-color:#075985;">
        <a href="{pay_url}" style="display:block;padding:12px 24px;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:14px;line-height:18px;font-weight:600;color:#FFFFFF;text-decoration:none;">View and pay invoice</a>
    </td>
</tr>
</table>

<p style="margin:0 0 6px 0;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12px;line-height:18px;color:#7A8794;">Button not working? Paste this address into your browser:</p>

<p style="margin:0;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12px;line-height:18px;color:#55636F;word-break:break-all;">{pay_url}</p>
